name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# All jobs run on GitHub-hosted runners. For a public repo these are free and,
# unlike self-hosted runners, cannot be used by a fork PR to execute code on the
# maintainer's own machines — so no fork `if:` guard is needed. If you ever move
# release builds back to self-hosted runners, re-add a guard so fork pull_request
# events do not run on them:
#   if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

jobs:
  # Lint / test / typecheck.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libhamlib-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client deps
        working-directory: client
        run: npm ci
      # The server embeds client/dist at compile time via rust-embed, so the
      # client must be built before clippy/test or the embed derive fails to
      # compile. This also validates the client build and lets svelte-check reuse
      # the installed deps below.
      - name: Build client
        working-directory: client
        run: npm run build
      # NOTE: rustfmt is non-blocking. The codebase predates any rustfmt discipline
      # and is not yet fully formatted; enforcing `--check` now would fail the job.
      # Run `cargo fmt` across the crate in a dedicated cleanup change, then drop
      # `continue-on-error` to make formatting a hard gate.
      - name: Rustfmt
        working-directory: server
        run: cargo fmt --check
        continue-on-error: true
      # NOTE: clippy is intentionally run WITHOUT `-D warnings`. The codebase currently
      # has ~19 pre-existing clippy warnings; using `-D warnings` would make this job
      # immediately red. Once the existing warnings are cleaned up, tighten this to
      # `cargo clippy --all-targets -- -D warnings`.
      - name: Clippy
        working-directory: server
        run: cargo clippy --all-targets
      - name: Test
        working-directory: server
        run: cargo test
      - name: Svelte check
        working-directory: client
        run: npm run check

  # Build the Svelte client (shared across all platform builds)
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/

  # Windows x64 — with Hamlib (vendored DLLs)
  windows:
    needs: client
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build
        working-directory: server
        run: cargo build --release
      - name: Package
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item target/release/betterft8-server.exe release/
          Copy-Item server/hamlib-lib/libhamlib-4.dll release/
          Copy-Item server/hamlib-lib/libgcc_s_seh-1.dll release/
          Copy-Item server/hamlib-lib/libusb-1.0.dll release/
          Copy-Item server/hamlib-lib/libwinpthread-1.dll release/
      - uses: actions/upload-artifact@v4
        with:
          name: betterft8-windows-x64
          path: release/

  # Windows x64 — rigctld only (no Hamlib DLLs needed)
  windows-rigctld:
    needs: client
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build
        working-directory: server
        run: cargo build --release --no-default-features
      - name: Package
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item target/release/betterft8-server.exe release/
      - uses: actions/upload-artifact@v4
        with:
          name: betterft8-windows-x64-rigctld
          path: release/

  # Linux x64 — with Hamlib (requires libhamlib4 at runtime)
  linux:
    needs: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libhamlib-dev
      - name: Build
        working-directory: server
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p release
          cp target/release/betterft8-server release/
      - uses: actions/upload-artifact@v4
        with:
          name: betterft8-linux-x64
          path: release/

  # Linux x64 — rigctld only (no Hamlib dependency)
  linux-rigctld:
    needs: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Build
        working-directory: server
        run: cargo build --release --no-default-features
      - name: Package
        run: |
          mkdir -p release
          cp target/release/betterft8-server release/
      - uses: actions/upload-artifact@v4
        with:
          name: betterft8-linux-x64-rigctld
          path: release/

  # Raspberry Pi aarch64 — with Hamlib (requires libhamlib4 at runtime)
  raspberry-pi:
    needs: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build
        run: cross build --release --target aarch64-unknown-linux-gnu --manifest-path server/Cargo.toml
      - name: Package
        run: |
          mkdir -p release
          cp target/aarch64-unknown-linux-gnu/release/betterft8-server release/
      - uses: actions/upload-artifact@v4
        with:
          name: betterft8-raspberry-pi-aarch64
          path: release/

  # Raspberry Pi aarch64 — rigctld only (no Hamlib dependency)
  raspberry-pi-rigctld:
    needs: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build
        run: cross build --release --no-default-features --target aarch64-unknown-linux-gnu --manifest-path server/Cargo.toml
      - name: Package
        run: |
          mkdir -p release
          cp target/aarch64-unknown-linux-gnu/release/betterft8-server release/
      - uses: actions/upload-artifact@v4
        with:
          name: betterft8-raspberry-pi-aarch64-rigctld
          path: release/
