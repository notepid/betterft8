name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# SECURITY: The release build jobs below run on self-hosted runners. In a public
# repo, running self-hosted runners for `pull_request` events from forks would let
# any fork PR execute arbitrary code on the maintainer's machines. Every self-hosted
# job is therefore gated with an `if:` guard that allows the job only for `push`
# events (to main) and for pull requests that originate from THIS repository (not a
# fork). Fork PRs are validated by the GitHub-hosted `verify` job instead.

jobs:
  # Lint / test / typecheck on a GitHub-hosted runner. This is the only job that is
  # safe to run for fork pull requests, so it runs for all events (no fork guard).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libhamlib-dev
      - name: Rustfmt
        working-directory: server
        run: cargo fmt --check
      # NOTE: clippy is intentionally run WITHOUT `-D warnings`. The codebase currently
      # has ~19 pre-existing clippy warnings; using `-D warnings` would make this job
      # immediately red. Once the existing warnings are cleaned up, tighten this to
      # `cargo clippy --all-targets -- -D warnings`.
      - name: Clippy
        working-directory: server
        run: cargo clippy --all-targets
      - name: Test
        working-directory: server
        run: cargo test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client deps
        working-directory: client
        run: npm ci
      # svelte-check via `npm run check`. Marked non-fatal in case the `check` script
      # is not yet present in client/package.json.
      - name: Svelte check
        working-directory: client
        run: npm run check
        continue-on-error: true

  # Build the Svelte client (shared across all platform builds)
  client:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/

  # Windows x64 — with Hamlib (vendored DLLs)
  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: client
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/
      - name: Update Rust
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build
        working-directory: server
        run: cargo build --release
      - name: Package
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item target/release/betterft8-server.exe release/
          Copy-Item server/hamlib-lib/libhamlib-4.dll release/
          Copy-Item server/hamlib-lib/libgcc_s_seh-1.dll release/
          Copy-Item server/hamlib-lib/libusb-1.0.dll release/
          Copy-Item server/hamlib-lib/libwinpthread-1.dll release/
      - uses: actions/upload-artifact@v4
        with:
          name: betterft8-windows-x64
          path: release/

  # Windows x64 — rigctld only (no Hamlib DLLs needed)
  windows-rigctld:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: client
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/
      - name: Update Rust
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build
        working-directory: server
        run: cargo build --release --no-default-features
      - name: Package
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item target/release/betterft8-server.exe release/
      - uses: actions/upload-artifact@v4
        with:
          name: betterft8-windows-x64-rigctld
          path: release/

  # Linux x64 — with Hamlib (requires libhamlib4 at runtime)
  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: client
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libhamlib-dev
      - name: Build
        working-directory: server
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p release
          cp target/release/betterft8-server release/
      - uses: actions/upload-artifact@v4
        with:
          name: betterft8-linux-x64
          path: release/

  # Linux x64 — rigctld only (no Hamlib dependency)
  linux-rigctld:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: client
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Build
        working-directory: server
        run: cargo build --release --no-default-features
      - name: Package
        run: |
          mkdir -p release
          cp target/release/betterft8-server release/
      - uses: actions/upload-artifact@v4
        with:
          name: betterft8-linux-x64-rigctld
          path: release/

  # Raspberry Pi aarch64 — with Hamlib (requires libhamlib4 at runtime)
  raspberry-pi:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: client
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build
        run: cross build --release --target aarch64-unknown-linux-gnu --manifest-path server/Cargo.toml
      - name: Package
        run: |
          mkdir -p release
          cp target/aarch64-unknown-linux-gnu/release/betterft8-server release/
      - uses: actions/upload-artifact@v4
        with:
          name: betterft8-raspberry-pi-aarch64
          path: release/

  # Raspberry Pi aarch64 — rigctld only (no Hamlib dependency)
  raspberry-pi-rigctld:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: client
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build
        run: cross build --release --no-default-features --target aarch64-unknown-linux-gnu --manifest-path server/Cargo.toml
      - name: Package
        run: |
          mkdir -p release
          cp target/aarch64-unknown-linux-gnu/release/betterft8-server release/
      - uses: actions/upload-artifact@v4
        with:
          name: betterft8-raspberry-pi-aarch64-rigctld
          path: release/
